# Install once per clone: uv run pre-commit install
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Fixers run at commit only, never at push, and never on results: a hook must not change evidence.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=1000]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^(LICENSE|results/|research/.*/checks/.*\.out$)
      - id: trailing-whitespace
        stages: [pre-commit]
        args: [--markdown-linebreak-ext=md]
        exclude: ^(LICENSE|results/|research/.*/checks/.*\.out$)
      - id: no-commit-to-branch
        stages: [pre-commit]
        args: [--branch, main]

  - repo: local
    hooks:
      - id: protected-paths
        name: protected paths are never committed
        entry: uv run --frozen python scripts/hooks/check_staged.py
        language: system
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, jupyter]
      - id: config-schemas
        name: config and marker YAML match their schemas
        entry: uv run --frozen pytest -q tests/test_config.py
        language: system
        files: ^(config|markers)/.*\.yaml$
        pass_filenames: false

      - id: protect-main
        name: no direct push to main
        entry: uv run --frozen python scripts/hooks/protect_branch.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: verify
        name: verify (lint, tests, schemas, run inputs, holdout isolation)
        entry: uv run --frozen python scripts/verify.py --allow-not-run
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
