# Template for holdout/traps.yaml. Copy it there and fill it in; holdout/ is git-ignored.
# Eme lists the traps she knows. evaluate.py then reports which ones the agent flagged on its own.
# This answers the question: which checks did the agent run itself, and which did an expert add?
schema: zf.traps/v1
traps:
  - id: example_library_size_marker
    description: "A published dedifferentiation marker that mostly tracks library size"
    target: {kind: gene, symbol: TBD}     # kind: gene | axis | library | cluster
    caught_by_check: library_size         # the check id in config/checks.yaml expected to flag it
